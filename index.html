<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault</title>
<style>
:root{
  --bg:#111318;--panel:#181b21;--panel2:#1d2129;--border:#2b3039;
  --text:#d7dae0;--muted:#858c99;--accent:#8b7cf6;--accent2:#a89dff;
  --code:#0d0f13;--code-text:#d5d9e1;--inline-code-bg:#242832;
  --quote:#858cff;--quote-text:#aeb3be;--quote-bg:#ffffff03;
  --heading:#f0f1f4;--hover-bg:#ffffff08;--shadow:0 14px 40px #0005;
}
:root[data-theme="light"]{
  --bg:#f7f7f8;--panel:#ffffff;--panel2:#eef0f3;--border:#dde1e7;
  --text:#20242b;--muted:#6a7180;--accent:#7c5cf0;--accent2:#6247c4;
  --code:#f1f2f5;--code-text:#2a2e37;--inline-code-bg:#e6e8ed;
  --quote:#7c5cf0;--quote-text:#4a4f5a;--quote-bg:#00000006;
  --heading:#14161b;--hover-bg:#00000009;--shadow:0 14px 40px #0002;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
.hidden{display:none!important}
.spacer{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{overflow:hidden}
.app{height:100%;display:flex;--side:270px}
.sidebar{flex:0 0 var(--side);min-width:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border)}
.side-resizer{flex:0 0 5px;margin-left:-3px;cursor:col-resize;z-index:2;touch-action:none}
.side-resizer:hover,.app.resizing .side-resizer{background:var(--accent)}
.app.resizing{user-select:none}.app.resizing iframe{pointer-events:none}
.app.side-closed .sidebar,.app.side-closed .side-resizer{display:none}
.main{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.topbar{flex:0 0 46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);min-width:0}
.crumbs{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.title{flex:0 1 320px;min-width:60px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--heading);font-weight:600;font-size:14px;text-overflow:ellipsis}
.title:not(:disabled):not([readonly]):hover{border-color:var(--border)}
.title:not(:disabled):not([readonly]):focus{background:var(--panel2)}
.title[readonly]{cursor:default}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.unsaved{color:var(--accent2);border-color:var(--accent)}
.workspace{flex:1 1 0;min-height:0;display:flex}
.editor-pane,.preview-pane{flex:1 1 0;min-width:0;overflow:auto}
.editor-pane{border-right:1px solid var(--border)}
.editor-wrap{max-width:900px;margin:auto;padding:40px 56px 100px;min-height:100%;display:flex}
#editor{flex:1;width:100%;min-height:calc(100vh - 200px);resize:none;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.75 "SFMono-Regular",Consolas,"Liberation Mono",monospace;tab-size:2}
.preview-pane{position:relative}
#htmlFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.blank{flex:1;display:none;align-items:center;justify-content:center;overflow:auto}
.workspace[data-view="edit"] .preview-pane{display:none}
.workspace[data-view="edit"] .editor-pane{border-right:0}
.workspace[data-view="read"] .editor-pane{display:none}
.workspace[data-kind="none"] .editor-pane,.workspace[data-kind="none"] .preview-pane{display:none}
.workspace[data-kind="none"] .blank{display:flex}
.workspace[data-kind="text"] .preview-pane{display:none}
.workspace[data-kind="text"] .editor-pane{display:block;border-right:0;overflow:hidden}
.workspace[data-kind="text"] .editor-wrap{max-width:none;padding:0;height:100%}
.workspace[data-kind="text"] #editor{min-height:0;height:100%;padding:24px 32px 60px}
.workspace[data-kind="view"] .editor-pane{display:none}
.workspace[data-kind="view"] .preview-pane{display:block}
.status{flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font:11px "SFMono-Regular",Consolas,monospace;white-space:nowrap;overflow:hidden}
.status-right{display:flex;gap:15px}
.scrim{position:fixed;inset:0;background:#0007;z-index:19}
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:20;box-shadow:var(--shadow)}
  .side-resizer{display:none}
  .crumbs{display:none}
  .workspace{flex-direction:column}
  .editor-pane{border-right:0;border-bottom:1px solid var(--border)}
  .editor-wrap,.preview{padding:24px 18px 70px}
  #editor{min-height:40vh}
}
.side-head{flex:0 0 46px;display:flex;align-items:center;gap:2px;padding:0 8px 0 14px;border-bottom:1px solid var(--border)}
.vault-name{flex:1;min-width:0;font-weight:700;font-size:14px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-search{flex:0 0 auto;padding:8px 10px 6px}
.side-search input{width:100%;height:30px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;outline:0}
.side-search input:focus{border-color:var(--accent)}
.tree{flex:1 1 0;min-height:0;overflow:auto;padding:2px 6px 12px;font-size:13.5px;user-select:none}
.row{--d:0;display:flex;align-items:center;gap:5px;height:28px;padding:0 4px 0 calc(6px + var(--d) * 14px);border-radius:6px;cursor:pointer;color:var(--text);white-space:nowrap}
.row:hover{background:var(--hover-bg)}
.row.active{background:var(--accent);color:#fff}
.row .ic{width:15px;height:15px;color:var(--muted)}
.row.active .ic{color:#fff}
.row .chev{transition:transform .12s}
.row.open > .chev{transform:rotate(90deg)}
.row .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .sub{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11.5px}
.row.active .sub{color:#fffc}
.row.dir .name{font-weight:600}
.row .ext{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.row.active .ext{color:#fffc}
.row .mark{flex:0 0 7px;width:7px;height:7px;border-radius:50%}
.row.unsaved .mark{background:var(--accent2)}
.row.active.unsaved .mark{background:#fff}
.row .more{flex:0 0 22px;width:22px;height:22px;display:none;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;padding:0}
.row:hover .more,.row.active .more{display:inline-flex}
.row .more:hover{background:#ffffff22}
.tree-note{padding:8px 10px;color:var(--muted);font-size:12.5px;line-height:1.5}
.tree.droptarget{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:8px}
.side-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border);font-size:12px}
.changes{flex:1;min-width:0;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.changes.has{color:var(--accent2);border-color:var(--accent)}
.changes:hover{background:var(--hover-bg)}
.side-foot a{color:var(--muted);text-decoration:none;white-space:nowrap}
.side-foot a:hover{color:var(--text)}
.section{display:flex;align-items:center;gap:6px;height:26px;margin:10px 0 2px;padding:0 4px 0 8px;border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.section:first-child{margin-top:2px}
.section:hover{background:var(--hover-bg);color:var(--text)}
.section.target{color:var(--accent2)}
.section .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.section .more{flex:0 0 22px;width:22px;height:22px;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;padding:0}
.section .more{display:inline-flex}
.row.drop,.section.drop,.srcseg button.drop{outline:1.5px dashed var(--accent2);outline-offset:-2px;background:var(--hover-bg)}
.srcseg{display:flex;margin:8px 10px 0}
.srcseg button{flex:1;width:auto;height:26px;font-size:12.5px;white-space:nowrap}
.srcseg button:disabled{opacity:.4;cursor:not-allowed}
.srcinfo{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-note .btn{margin-top:10px}
.hit{margin:0 0 1px 22px;padding:3px 8px;border-left:2px solid var(--border,#8884);border-radius:0 5px 5px 0;color:var(--muted);font-size:12px;line-height:1.45;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit:hover{background:var(--hover-bg);color:var(--text)}
.hit mark{background:var(--accent2);color:#000;border-radius:2px;padding:0 1px}
.tagrow{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;cursor:pointer;color:var(--accent2);font-size:12.5px}
.tagrow:hover{background:var(--hover-bg)}
.tagrow .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow .sub{color:var(--muted);font-size:11px}
.tree-note.found{padding:4px 10px;font-size:11.5px}
.preview{max-width:900px;margin:auto;padding:48px 64px 100px;font-size:16px;line-height:1.8}
.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{line-height:1.25;color:var(--heading);margin:1.5em 0 .55em}
.preview h1{font-size:2.15em}.preview h2{font-size:1.65em}.preview h3{font-size:1.3em}
.preview p{margin:.75em 0}.preview a{color:var(--accent2)}
.preview blockquote{border-left:3px solid var(--quote);margin:1em 0;padding:.15em 1em;color:var(--quote-text);background:var(--quote-bg)}
.preview code{font: .9em "SFMono-Regular",Consolas,monospace;background:var(--inline-code-bg);color:var(--text);border-radius:5px;padding:.15em .38em}
.preview pre{background:var(--code);border:1px solid var(--border);border-radius:9px;padding:16px;overflow:auto}
.preview pre code{background:transparent;padding:0;color:var(--code-text)}
.codewrap{position:relative}
.code-copy{position:absolute;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;opacity:0;transition:opacity .12s;font-size:13px}
.codewrap:hover .code-copy{opacity:1}
.code-copy:hover{background:var(--hover-bg);color:var(--text)}
.code-copy.copied{opacity:1;color:var(--accent)}
.preview ul,.preview ol{padding-left:1.7em}
.preview table{border-collapse:collapse;width:100%;margin:1em 0}
.preview th,.preview td{border:1px solid var(--border);padding:8px 10px;text-align:left}
.preview th{background:var(--panel2)}
.preview table.frontmatter{background:var(--panel2);border:1px solid var(--border);border-radius:8px;font-size:.85em;margin:0 0 1.4em}
.preview table.frontmatter th,.preview table.frontmatter td{border:0;border-bottom:1px solid var(--border);padding:6px 12px}
.preview table.frontmatter tr:last-child th,.preview table.frontmatter tr:last-child td{border-bottom:0}
.preview table.frontmatter th{background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;width:1%}
.preview hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.preview img{max-width:100%;border-radius:8px}
.task{list-style:none;margin-left:-1.35em}
.task input{accent-color:var(--accent);margin-right:7px}
.preview a.wikilink{color:var(--accent2);text-decoration:none;border-bottom:1px dashed var(--accent2);cursor:pointer}
.preview a.wikilink.missing{color:var(--muted);border-bottom-color:var(--muted)}
.fileview{max-width:900px;margin:auto;padding:48px 32px;text-align:center;color:var(--muted)}
.fileview img{max-width:100%;border-radius:8px;box-shadow:var(--shadow);background:#fff}
.fileview .linkbtn{margin:0 6px}
.preview a.tag{color:var(--accent2);background:var(--hover-bg);border-radius:10px;padding:1px 7px;font-size:.92em;text-decoration:none;cursor:pointer}
.preview a.tag:hover{filter:brightness(1.15)}
.iconbtn{width:30px;height:30px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted);padding:0}
.iconbtn:hover{background:var(--hover-bg);color:var(--text)}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13.5px}
.btn:hover{background:var(--hover-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.danger{background:#d9463e;border-color:#d9463e;color:#fff}
.linkbtn{border:0;background:none;color:var(--accent2);padding:0 2px;font-weight:600}
.linkbtn:hover{text-decoration:underline}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--panel2);border:1px solid var(--border)}
.seg button{width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted);padding:0}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--accent);color:#fff}
.seg.disabled{opacity:.4;pointer-events:none}
.blank-inner{max-width:440px;padding:32px;text-align:center}
.blank-inner h1{margin:0 0 8px;color:var(--heading);font-size:26px}
.blank-inner p{margin:0 0 20px;color:var(--muted);line-height:1.6}
.blank-actions{display:flex;gap:8px;justify-content:center;margin-bottom:26px}
.blank-keys{list-style:none;margin:0;padding:0;color:var(--muted);font-size:12.5px;line-height:2}
kbd,.blank-keys code{font:11.5px "SFMono-Regular",Consolas,monospace;padding:1px 5px;border:1px solid var(--border);border-radius:4px;background:var(--panel2);color:var(--text)}
.ctx{position:fixed;z-index:40;min-width:190px;padding:5px;border-radius:9px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow)}
.ctx button{display:block;width:100%;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);text-align:left;font-size:13px;white-space:nowrap}
.ctx button:hover{background:var(--hover-bg)}
.ctx button.danger{color:#ff7d76}
.ctx hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16vh 16px 16px;background:#0008}
.modalbox{width:min(420px,100%);padding:18px;border-radius:12px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow)}
.modalbox h3{margin:0 0 10px;color:var(--heading);font-size:15px}
.modalbox p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre-line}
.modalbox input{width:100%;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:0}
.modalbox input:focus{border-color:var(--accent)}
.modal-err{min-height:18px;margin-top:5px;color:#ff7d76;font-size:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:60;max-width:min(600px,calc(100vw - 24px));display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;background:var(--heading);color:var(--bg);box-shadow:var(--shadow);font-size:13.5px}
.toast.error{background:#d9463e;color:#fff}
.toast .linkbtn{color:inherit;text-decoration:underline;white-space:nowrap}
.dropveil{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:#8b7cf622;pointer-events:none}
.dropveil div{padding:18px 26px;border:2px dashed var(--accent);border-radius:14px;background:var(--panel);font-weight:600}
@media(max-width:760px){.preview{padding:24px 18px 70px}}
.iconbtn:disabled{opacity:.35;cursor:default}
.modal-check{display:flex;align-items:center;gap:8px;margin:2px 0 6px;color:var(--text);font-size:13.5px;cursor:pointer}
.modalbox .modal-check input{width:16px;height:16px;flex:0 0 16px;padding:0;accent-color:var(--accent)}
</style>
</head>
<body>

<svg class="hidden" aria-hidden="true">
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
  <symbol id="i-newnote" viewBox="0 0 24 24"><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8l4 4v3M14 4v4h4M17 14v6M14 17h6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-newfolder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
  <symbol id="i-read" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="파일 트리">
    <div class="side-head">
      <div class="vault-name" id="vaultName">Vault</div>
      <button class="iconbtn" id="newNoteBtn" title="새 노트 (Alt+N)"><svg class="ic"><use href="#i-newnote"/></svg></button>
      <button class="iconbtn" id="newFolderBtn" title="새 폴더"><svg class="ic"><use href="#i-newfolder"/></svg></button>
      <button class="iconbtn" id="refreshBtn" title="목록 다시 읽기"><svg class="ic"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="seg srcseg" id="sourceSeg" role="group" aria-label="저장 방식">
      <button data-src="repo" title="저장소: 올라가 있는 노트를 읽습니다 (읽기 전용)">저장소</button>
      <button data-src="folder" title="폴더: 직접 고른 폴더에 .md 파일로 바로 저장합니다">폴더</button>
      <button data-src="local" title="브라우저: 이 브라우저에 저장합니다 (ZIP 으로 내보내기)">브라우저</button>
    </div>
    <div class="side-search"><input id="filterInput" type="search" placeholder="찾기: 이름 · 내용 · #태그 (Ctrl+O)" autocomplete="off" spellcheck="false"></div>
    <nav class="tree" id="tree" role="tree"></nav>
    <div class="side-foot">
      <span class="srcinfo" id="srcInfo"></span>
